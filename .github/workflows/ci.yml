# CI: check the source, then build, smoke-test and publish the container image.
#
# Every pull request runs the checks and builds the image for both
# architectures, then starts it against a throwaway Postgres to prove the
# entrypoint migrates and serves. Nothing is pushed for a pull request.
#
# Pushes to main and v* tags also publish a multi-arch image to the GitHub
# Container Registry of whichever repository runs this workflow
# (ghcr.io/<owner>/<repo>), using the built-in GITHUB_TOKEN. No secrets and no
# deployment-specific values live here.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  test:
    name: Typecheck, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the node:22-alpine base of the Dockerfile.
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  image:
    name: Image (${{ matrix.arch }})
    needs: test
    # Each architecture builds natively: emulating the Next.js build under QEMU
    # is several times slower.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects upper-case repository names, and an owner may have them.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: vital:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      # The container migrates before it serves and refuses to start when that
      # fails (scripts/docker-entrypoint.sh), so a healthy response proves the
      # standalone bundle, the migration CLI and every migration in db/ work.
      - name: Smoke test
        env:
          PG_PASSWORD: ci-only-not-a-secret
        run: |
          set -euo pipefail
          docker network create vital-ci
          docker run -d --name vital-ci-pg --network vital-ci \
            -e POSTGRES_USER=vital -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB=vital \
            postgres:16-alpine
          for _ in $(seq 1 30); do
            docker exec vital-ci-pg pg_isready -U vital -d vital >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec vital-ci-pg pg_isready -U vital -d vital

          docker run -d --name vital-ci-app --network vital-ci -p 3000:3000 \
            -e VITAL_PG_HOST=vital-ci-pg -e VITAL_PG_PORT=5432 \
            -e VITAL_PG_DATABASE=vital -e VITAL_PG_USER=vital \
            -e VITAL_PG_PASSWORD="$PG_PASSWORD" -e VITAL_PG_SSL=false \
            -e VITAL_DATA_MODE=demo -e ANALYST_PROVIDER=demo \
            vital:ci

          healthy=false
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then healthy=true; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' vital-ci-app)" != true ]; then break; fi
            sleep 2
          done
          echo
          if [ "$healthy" != true ]; then
            echo "::error::The image did not become healthy"
            docker logs vital-ci-app || true
            docker logs vital-ci-pg || true
            exit 1
          fi

          # The demo-mode Overview must render, not just the health route.
          curl -fsS -o /dev/null -w 'GET / → HTTP %{http_code}\n' http://127.0.0.1:3000/
          docker logs vital-ci-app

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs and cache as the build above, so this is a cache hit. The
      # platform image is pushed by digest only; the publish job names it.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main → :main and :sha-<short>; tag v1.2.3 → :1.2.3, :1.2, :latest and
      # :sha-<short>. `latest` follows releases, not every merge.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "--tag=" + .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
